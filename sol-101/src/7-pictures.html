<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://www.moma.org/dist/main.cb125fce90ef23a93a04.css" />
    <link rel="stylesheet" href="../node_modules/sol/dist/sol.css" />
    <title>Atoms 7: Pictures</title>
  </head>
  <body>
    <div
      class="
        layout/wrapper
        layout/margin:top:page:2
      ">
      <section
        class="
          layout/flex:column
          @480/layout/flex:row
        "
        >
        <div
          class="
            @480/layout/width
            layout/width:100%
          "
          style="
            --480--layout--width: var(--uneven-column-width--side);
          ">
          <include src="./src/partials/toc.html"></include>
        </div>
        <div
          class="
            @480/layout/margin:left:page
            @480/layout/margin:top:baseline:clear
            @480/layout/width

            layout/justify:start
            layout/margin:top:page:2
            layout/width:100%
          "
          style="
            --480--layout--width:        var(--uneven-column-width--main);
          "
          >




          <!-- Begin Example -->
          <div class="layout/margin:top:page">
            <picture class="picture">
              <img class="picture/image" data-link-image src="https://placehold.co/500x500" />
            </picture>
          </div>
          <!-- End Example -->





        </div>
      </section>
    </div>
