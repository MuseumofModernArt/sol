<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://www.moma.org/dist/main.cb125fce90ef23a93a04.css" />
    <link rel="stylesheet" href="../node_modules/sol/dist/sol.css" />
    <title>My First Parcel App</title>
  </head>
  <body>
    <div
      class="
        layout/wrapper
        layout/margin:top:page:2
      ">
      <section
        class="
          layout/flex:column
          @480/layout/flex:row
        "
        >
        <div
          class="
            @480/layout/width
            layout/width:100%
          "
          style="
            --480--layout--width: var(--uneven-column-width--side);
          ">
          <include src="./src/partials/toc.html"></include>
        </div>
        <div
          class="
            @480/layout/margin:left:page
            @480/layout/margin:top:baseline:clear
            @480/layout/width
            $typography/size:large
            layout/justify:start
            layout/margin:top:page:2
            layout/width:100%
          "
          style="
            --480--layout--width:        var(--uneven-column-width--main);
          "
          >





          <!-- Begin Example -->
          <a
            data-link-card
            class="link/focus"
            href="https://www.butdoesitfloat.com">
            <div
              class="
                @480/layout/padding:page:0.5
                $color/gray:888 color/background
                layout/border
                layout/padding:page
                "
              >
              <div
                class="
                  @480/layout/grid:3
                  @480/layout/grid:gap:column:page
                  layout/grid:1"
                >
                <div
                  class="
                    @480/layout/margin:top:clear
                    @480/layout/order:clear
                    $color
                    layout/grid:column:span:2
                    layout/margin:top:page
                    layout/order:2
                    "
                  >
                  <h3
                    class="
                    $typography/size:large
                    typography"
                    >
                    <span class="icon-link">
                      <span
                        ><nobr
                          >Modern Art and Ideas<svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 16 16"
                            class="icon-link__svg"
                            >
                            <path
                              d="M2.5 8H13"
                              fill="none"
                              vector-effect="non-scaling-stroke"
                            ></path>
                            <path
                              d="M8 3l5 5-5 5"
                              fill="none"
                              vector-effect="non-scaling-stroke"
                            ></path></svg></nobr
                      ></span>
                    </span>
                  </h3>
                  <div
                    class="
                    $typography/baseline:body
                    $typography/size:small
                    $typography/weight:regular
                    layout/margin:top:baseline"
                    >
                    <span class="typography typography/truncate:5">MoMA curators and educators introduce major artists and movements. Experience deep dives into iconic art, interviews with artists, interactive quizzes, and more.</span>
                  </div>
                </div>

                <div
                  class="
                  @480/layout/order:clear
                  layout/grid:column:span:1
                  layout/order:1"
                  >
                  <div>
                    <div class="ratio-container">
                      <div class="ratio-container__3-2"></div>
                      <div class="ratio-container__inner">
                        <picture
                          class="picture--center"
                          data-prevent-context-menu=""
                          >
                          <img
                            class="picture__img--crop--lower"
                            role="presentation"
                            draggable="false"
                            src="https://www.moma.org/d/p/sa/IN2369_14_CCCR-Full_JPEG.jpg"
                            data-prevent-context-menu=""
                          />
                        </picture>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </a>
          <!-- End Example -->





      </section>
      <!-- End: Section -->
    </div>
  </body>
</html>
